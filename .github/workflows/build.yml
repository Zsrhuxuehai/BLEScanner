name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: 'Build scheme'
        required: true
        default: 'BLEScanner'
        type: string
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

jobs:
  build:
    name: Build & Export IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project BLEScanner.xcodeproj \
            -scheme "${{ inputs.scheme }}" \
            -sdk iphoneos \
            -configuration "${{ inputs.configuration }}" \
            -archivePath ./build/BLEScanner.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=ABCDEF1234 \
            PRODUCT_BUNDLE_IDENTIFIER=com.blescanner.app \
            VALIDATE_PRODUCT=NO

      - name: Export IPA
        run: |
          mkdir -p ./build/ipa
          APP_PATH=$(find ./build/BLEScanner.xcarchive/Products/Applications -name "*.app" | head -1)
          mkdir -p ./build/ipa/Payload
          cp -R "$APP_PATH" ./build/ipa/Payload/
          cd ./build/ipa
          zip -r ../BLEScanner.ipa Payload
          cd ../..
          cp ./build/BLEScanner.ipa ./build/ipa/BLEScanner.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BLEScanner-${{ inputs.configuration }}.ipa
          path: ./build/ipa/*.ipa
          retention-days: 30

      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        with:
          name: BLEScanner-dSYM
          path: ./build/BLEScanner.xcarchive/dSYMs/*.dSYM
          retention-days: 30