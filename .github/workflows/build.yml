name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: 'Build scheme'
        required: true
        default: 'BLEScanner'
        type: string
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

jobs:
  build:
    name: Build & Export IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project BLEScanner.xcodeproj \
            -scheme ${{ inputs.scheme }} \
            -sdk iphoneos \
            -configuration ${{ inputs.configuration }} \
            -archivePath ./build/BLEScanner.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath ./build/BLEScanner.xcarchive \
            -exportPath ./build/ipa \
            -exportOptionsPlist ExportOptions.plist \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BLEScanner-${{ inputs.configuration }}.ipa
          path: ./build/ipa/*.ipa
          retention-days: 30

      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        with:
          name: BLEScanner-dSYM
          path: ./build/BLEScanner.xcarchive/dSYMs/*.dSYM
          retention-days: 30